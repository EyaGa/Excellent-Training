<div class="banner_section layout_padding">
   <div id="my_slider" class="carousel slide" data-ride="carousel">
      <div class="carousel-inner">
         <div class="carousel-item" *ngFor="let slide of slides; let i = index" [class.active]="i === 0">
         <div class="container">
            <div class="row">
               <div class="col-sm-12">
                  <div class="banner_taital_main">
                     <h1 class="banner_taital">{{ slide.title }}</h1>
                     <p class="banner_text">{{ slide.text }}</p>
                     <div class="btn_main">
                        <div class="started_text"><a routerLink="/{{ slide.link }}" >{{ slide.linkText }}</a></div>
                        <div class="started_text active"><a routerLink="/apropos" >A propos</a></div>
                     </div>
                  </div>
               </div>
            </div>
         </div>
      </div>
   </div>
   <a class="carousel-control-prev" href="#my_slider" role="button" data-slide="prev">
   <i class="fa fa-angle-left"></i>
   </a>
   <a class="carousel-control-next" href="#my_slider" role="button" data-slide="next">
   <i class="fa fa-angle-right"></i>
   </a>
</div>
</div>
