<!-- footer section start -->
<div class="footer_section layout_padding margin_top90">
   <div class="container">
      <div class="footer_section_2">
         <div class="row">
            <div class="col-md-4" *ngFor="let section of sections">
               <h3 class="footer_text">{{ section.title }}</h3>
               <p class="lorem_text">{{ section.text }}</p>
            </div>
            <div class="col-md-4">
               <h3 class="footer_text">Rejoignez-nous </h3>
               <div class="form-group">
                  <div class="subscribe_bt"><a routerLink="/register">Inscrivez-vous</a></div>
               </div>
               <div class="social_icon">
                  <ul>
                     <li *ngFor="let icon of socialIcons"><a href="#"><i class="{{ icon }}" aria-hidden="true"></i></a></li>
                  </ul>
               </div>
            </div>
         </div>
      </div>
   </div>
</div>
<!-- footer section end -->
<!-- copyright section start -->
<div class="copyright_section">
   <div class="container">
      <div class="row">
         <div class="col-sm-12">
            <p class="copyright_text"><a href="">Excellent Training - Green Building. Tous droits réservés.</a></p>
         </div>
      </div>
   </div>
</div>
